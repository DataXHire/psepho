version: 1

applications:
  - appRoot: apps/web
    frontend:
      phases:
        preBuild:
          commands:
            - corepack enable
            - corepack prepare pnpm@11.16.0 --activate
            - pnpm --version
            - pnpm install --frozen-lockfile
        build:
          commands:
            - env | grep -E '^(DATABASE_URL|SERVER_PEPPER|NEXT_PUBLIC_)' >> .env.production || true
            - pnpm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - ~/.local/share/pnpm/store/**/*
          - .next/cache/**/*
