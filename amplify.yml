version: 1

applications:
  - frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - corepack enable
            - corepack prepare pnpm@11.16.0 --activate
            - pnpm --version
            - pnpm install --frozen-lockfile

        build:
          commands:
            - env | grep -E '^(DATABASE_URL|SERVER_PEPPER|NEXT_PUBLIC_)' >> apps/web/.env.production || true
            - pnpm --filter @psepho/web build

      artifacts:
        baseDirectory: apps/web/.next
        files:
          - '**/*'

      cache:
        paths:
          - node_modules/**/*
          - apps/web/.next/cache/**/*

    appRoot: apps/web
