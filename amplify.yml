version: 1
applications:
  - appRoot: apps/web
    frontend:
      phases:
        preBuild:
          commands:
            - corepack enable
            - corepack prepare pnpm@latest --activate
            - pnpm --version
            - pnpm install --frozen-lockfile
        build:
          commands:
            - env | grep -E '^(DATABASE_URL|SERVER_PEPPER|NEXT_PUBLIC_)' >> .env.production || true
            - pnpm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - $(pnpm store path)/**/*
          - .next/cache/**/*
